[project]
name = "open-rag-final"
version = "0.1.0"
description = "Adaptive RAG API with citations, latency instrumentation, and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.4.0",
    "django>=6.0",
    "djangorestframework>=3.16.1",
    "docx2txt>=0.9",
    "drf-spectacular>=0.29.0",
    "joblib>=1.5.3",
    "langchain>=1.2.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.5",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.2.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.6",
    "langchain-text-splitters>=1.1.0",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.0.5",
    "pdf2image>=1.17.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pymupdf>=1.26.7",
    "python-dotenv>=1.2.1",
    "python-pptx>=1.0.2",
    "requests>=2.32.0",
    "tavily>=1.1.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.12.0",
    "typing-extensions>=4.15.0",
    "unstructured>=0.18.24",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.9.0",
    "python-docx>=1.1.0",
    "ruff>=0.6.0",
    "streamlit>=1.40.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "open_rag_final.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: calls real external LLM APIs and is skipped by default",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["my_rag_api", "rag_demo"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["my_rag_api", "rag_demo", "open_rag_final"]
